name: Changelog

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    # A newer push regenerates the whole file, so an older run has nothing left to add. Job-level, so that a
    # main push never cancels the release job of a tag push.
    concurrency:
      group: changelog
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit CHANGELOG.md if it changed
        run: |
          git diff --quiet CHANGELOG.md && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(changelog): regenerate CHANGELOG.md' CHANGELOG.md
          git pull --rebase origin main
          git push origin HEAD:main

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE.md
