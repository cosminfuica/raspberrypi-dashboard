<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon (manifest.webmanifest): the favicon's board mark on a full-bleed solder mask, inside the maskable
       safe circle (radius 40 %). The PNGs are made from it, in frontend/public:
       rsvg-convert -w 512 icon.svg -o icon-512.png; rsvg-convert -w 192 icon.svg -o icon-192.png;
       rsvg-convert -w 180 icon.svg -o apple-touch-icon.png -->
  <rect width="512" height="512" fill="#0b1712"/>
  <g transform="translate(256 256) scale(13) translate(-16 -16)" fill="#d9b35d">
    <rect x="4.5" y="7.5" width="23" height="17" rx="2.5" fill="none" stroke="#d9b35d" stroke-width="1.6"/>
    <rect x="11.5" y="11.5" width="9" height="9" rx="1"/>
    <circle cx="7.8" cy="10.8" r="1.1"/>
  </g>
</svg>
