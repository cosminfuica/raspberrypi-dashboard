# Regenerate: npx git-cliff -o CHANGELOG.md   (before a release: add --tag vX.Y.Z)

[changelog]
header = """
# Changelog

Generated from commit messages by [git-cliff](https://git-cliff.org) (`cliff.toml`). Do not edit by hand.
"""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}
{%- set subject = commit.message | split(pat="\n") | first | trim %}
{%- if group is containing("Backend") or group is containing("Frontend") or group is containing("Docs") %}
{%- set subject = subject | split(pat=": ") | slice(start=1) | join(sep=": ") | upper_first %}
{%- endif %}
- {{ subject }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/cosminfuica/raspberrypi-dashboard/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
postprocessors = [{ pattern = "\n{3,}", replace = "\n\n" }]

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The <!-- N --> prefixes only order the groups; striptags removes them in the body.
commit_parsers = [
  { message = "^chore\\((deps|changelog)\\)", skip = true },
  { message = "^([Mm]erge|integrate) ", skip = true },
  { message = "^backend", group = "<!-- 0 -->Backend" },
  { message = "^frontend", group = "<!-- 1 -->Frontend" },
  { message = "^(install\\.sh|uninstall\\.sh|deploy)", group = "<!-- 2 -->Install and deploy" },
  { message = "^docs", group = "<!-- 3 -->Docs" },
  { message = "^(ci|chore|gitignore|refactor|all)\\b", group = "<!-- 4 -->Maintenance" },
  { message = ".*", group = "<!-- 5 -->Other" },
]
